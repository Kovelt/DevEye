# DevEye — workspace autonome.
#
# Outil d'observation/pilotage d'apps en dev (screenshot, click, eval,
# DOM, logs…), originellement extrait de Chronos (crates/deveye) par
# `git subtree split`. Les crates gardent leurs métadonnées de package
# figées ; seul ce manifeste de workspace définit les dépendances partagées.
#
# CE DÉPÔT EST LA SOURCE DE VÉRITÉ (depuis M0, 25/06/2026). Les copies
# vendored consommées par les apps cibles (Chronos/crates/deveye,
# Atelier/deveye — deveye-core/ports/sdk uniquement) sont régénérées par
# scripts/sync-deveye.sh et ne doivent JAMAIS être éditées directement ;
# tout correctif naît ici puis est propagé par le script.

[workspace]
resolver = "2"
members = [
    "deveye-core",
    "deveye-ports",
    "deveye-sdk",
    "deveye-sdk-client",
    "deveye-server",
    "deveye-adapters/adapter-cdp-webview",
    "deveye-adapters/adapter-screencap-xcap",
    "deveye-adapters/adapter-dioxus-signals",
    "deveye-adapters/adapter-logs-tracing",
    "deveye-adapters/adapter-commands-http",
    "deveye-adapters/adapter-screencap-kwin",
    "deveye-adapters/adapter-interaction-kwin-eis",
    "deveye-adapters/adapter-mcp-server",
    "deveye-adapters/adapter-composite",
    "deveye-adapters/adapter-clipboard-wayland",
    "deveye-adapters/adapter-x11",
]

# Dépendances partagées (versions reprises telles quelles du workspace Chronos).
# Chaque crate ajoute ses propres features par-dessus via `{ workspace = true }`.
[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# D-Bus asynchrone (tokio) pour l'interface KWin ScreenShot2 — non substituable
# (l'interface n'expose pas d'autre protocole). Scope : adapter-screencap-kwin.
zbus = { version = "4", default-features = false, features = ["tokio"] }
# pipe2(O_CLOEXEC) sans unsafe libc direct. Scope : adapter-screencap-kwin.
nix = { version = "0.29", default-features = false, features = ["fs"] }

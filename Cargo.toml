# DevEye — workspace Cargo (16 crates, architecture hexagonale).
#
# Outil d'observation et de pilotage d'apps graphiques en développement
# (capture, interaction, inspection, logs), exposé en serveur MCP. Les crates
# `deveye-adapters/*` implémentent les ports de `deveye-ports` ; `deveye-server`
# les compose.
#
# Licences : l'outil (`deveye-server`, adapters) est sous AGPL-3.0-or-later,
# valeur par défaut ci-dessous ; les bibliothèques embarquées ou réutilisées
# (`deveye-core`, `deveye-ports`, `deveye-sdk`, `deveye-sdk-client`) sont sous
# MIT et surchargent le champ `license`. Un crate MIT ne dépend jamais d'un
# crate AGPL (ADR-0002). Chaque crate garde sa propre `version`.
#
# Documentation : docs/ (architecture, usage, protocole) et docs/adr/ pour les
# décisions.

[workspace]
resolver = "2"
members = [
    "deveye-core",
    "deveye-ports",
    "deveye-sdk",
    "deveye-sdk-client",
    "deveye-server",
    "deveye-adapters/adapter-cdp-webview",
    "deveye-adapters/adapter-screencap-xcap",
    "deveye-adapters/adapter-dioxus-signals",
    "deveye-adapters/adapter-logs-tracing",
    "deveye-adapters/adapter-commands-http",
    "deveye-adapters/adapter-screencap-kwin",
    "deveye-adapters/adapter-interaction-kwin-eis",
    "deveye-adapters/adapter-mcp-server",
    "deveye-adapters/adapter-composite",
    "deveye-adapters/adapter-clipboard-wayland",
    "deveye-adapters/adapter-x11",
]

# Métadonnées communes, héritées par chaque crate (`x.workspace = true`).
# `version` reste propre à chaque crate (cycle de release indépendant).
[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["NuvoraCode / Morgan Voltz"]
repository = "https://github.com/Morgan-Voltz/DevEye"
homepage = "https://github.com/Morgan-Voltz/DevEye"

# Lints communs (ADR-0009). Chaque crate les active par `[lints] workspace = true`.
# Seule exception : adapter-interaction-kwin-eis, qui déclare ses propres lints
# (un unique `unsafe` localisé, cf. son Cargo.toml).
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

# Dépendances partagées.
# Chaque crate ajoute ses propres features par-dessus via `{ workspace = true }`.
[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# D-Bus asynchrone (tokio) pour l'interface KWin ScreenShot2 — non substituable
# (l'interface n'expose pas d'autre protocole). Scope : adapter-screencap-kwin.
zbus = { version = "4", default-features = false, features = ["tokio"] }
# pipe2(O_CLOEXEC) sans unsafe libc direct. Scope : adapter-screencap-kwin.
nix = { version = "0.29", default-features = false, features = ["fs"] }

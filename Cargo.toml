# DevEye — workspace autonome.
#
# Outil d'observation/pilotage d'apps Dioxus en dev (screenshot, click, eval,
# DOM, logs…), extrait de Chronos (crates/deveye) par `git subtree split` en
# préservant l'historique. Les crates gardent leurs métadonnées de package
# figées ; seul ce manifeste de workspace définit les dépendances partagées
# (auparavant héritées du workspace Chronos).
#
# Note : le développement actif de DevEye continue dans le repo Chronos
# (crates/deveye) ; ce dépôt est un export miroir à resynchroniser.

[workspace]
resolver = "2"
members = [
    "deveye-core",
    "deveye-ports",
    "deveye-sdk",
    "deveye-server",
    "deveye-adapters/adapter-cdp-webview",
    "deveye-adapters/adapter-screencap-xcap",
    "deveye-adapters/adapter-dioxus-signals",
    "deveye-adapters/adapter-logs-tracing",
    "deveye-adapters/adapter-commands-http",
    "deveye-adapters/adapter-mcp-server",
]

# Dépendances partagées (versions reprises telles quelles du workspace Chronos).
# Chaque crate ajoute ses propres features par-dessus via `{ workspace = true }`.
[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

name: Rapport de bogue
description: Signaler un comportement incorrect de DevEye
title: "[Bogue] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de votre rapport. Pour une faille de sécurité, n'ouvrez pas d'issue : voir SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Sortie de `deveye-server --version`.
      placeholder: deveye-server 1.1.0
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Cible
      description: Valeur de l'option `--target` utilisée.
      placeholder: sdk, cdp, kwin-eis, x11...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Distribution, session Wayland ou X11, compositeur.
      placeholder: |
        Distribution : Fedora 44
        Session : Wayland
        Compositeur : KWin
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sortie de `deveye-server doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
      description: Messages d'erreur et journaux utiles. Retirez tout secret.
    validations:
      required: true

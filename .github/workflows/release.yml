# Publication d'une version : archive Linux x86_64, sommes SHA-256 et brouillon
# de GitHub Release. Rien n'est publié automatiquement : le mainteneur relit le
# brouillon, puis le publie à la main (ADR-0038). Aucune publication crates.io
# ici (ADR-0004).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Archive ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Même liste que APT_DEPS de ci.yml (sans xvfb, inutile ici).
      - name: Dépendances système
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libxcb1-dev libxrandr-dev libdbus-1-dev libxkbcommon-dev libgbm-dev
          libpipewire-0.3-dev libspa-0.2-dev libclang-dev
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Le tag correspond à la version de deveye-server
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "deveye-server") | .version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à deveye-server ${version}." >&2
            exit 1
          fi
      - name: Section du CHANGELOG pour cette version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, "## " v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Aucune section « ## [${version}] » non vide dans CHANGELOG.md." >&2
            exit 1
          fi
      - name: Build release
        run: cargo build --release --locked -p deveye-server
      - name: Archive et sommes de contrôle
        run: |
          name="deveye-server-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "${name}"
          cp "target/release/deveye-server" LICENSE LICENSE-MIT README.md CHANGELOG.md "${name}/"
          tar -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            deveye-server-*.tar.gz
            SHA256SUMS
            release-notes.md
          if-no-files-found: error

  draft:
    name: Brouillon de GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Seul job avec droit d'écriture, et sans aucun code du dépôt exécuté.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
      - name: Créer le brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --draft
          --title "DevEye ${GITHUB_REF_NAME}"
          --notes-file release-notes.md
          deveye-server-*.tar.gz SHA256SUMS

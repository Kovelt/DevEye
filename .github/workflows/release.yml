# Publication d'une version : archive Linux x86_64, sommes SHA-256 et brouillon
# de GitHub Release. Rien n'est publié automatiquement : le mainteneur relit le
# brouillon, puis le publie à la main (ADR-0038). Aucune publication crates.io
# ici (ADR-0004).
name: Release

on:
  push:
    # Versions `vX.Y.Z` et pré-versions `vX.Y.Z-rc1` ; tout autre tag est ignoré.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  # Porte de qualité : un tag posé sur un commit rouge ne produit pas d'archive.
  # Mêmes vérifications bloquantes que ci.yml (format, clippy, tests, deny).
  quality:
    name: Porte de qualité
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dépendances système
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libxcb1-dev libxrandr-dev libdbus-1-dev libxkbcommon-dev libgbm-dev
          libpipewire-0.3-dev libspa-0.2-dev libclang-dev xvfb
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: taiki-e/install-action@09dc018eee06ae1c9e0409786563f534210ceb83 # v2.49.50
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo deny check
      - run: scripts/verify-license-boundary.sh

  build:
    name: Archive ${{ github.ref_name }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Même liste que APT_DEPS de ci.yml (sans xvfb, inutile ici).
      - name: Dépendances système
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libxcb1-dev libxrandr-dev libdbus-1-dev libxkbcommon-dev libgbm-dev
          libpipewire-0.3-dev libspa-0.2-dev libclang-dev
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Le tag correspond à la version de deveye-server
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "deveye-server") | .version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à deveye-server ${version}." >&2
            exit 1
          fi
      - name: Section du CHANGELOG pour cette version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, "## " v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Aucune section « ## [${version}] » non vide dans CHANGELOG.md." >&2
            exit 1
          fi
      - name: Build release
        run: cargo build --release --locked -p deveye-server
      - name: Archive et sommes de contrôle
        run: |
          name="deveye-server-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "${name}"
          cp "target/release/deveye-server" LICENSE LICENSE-MIT README.md CHANGELOG.md "${name}/"
          tar -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            deveye-server-*.tar.gz
            SHA256SUMS
            release-notes.md
          if-no-files-found: error

  draft:
    name: Brouillon de GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Seul job avec droit d'écriture, et sans aucun code du dépôt exécuté.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
      - name: Créer le brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Une pré-version (tag avec tiret) est marquée comme telle.
          PRERELEASE_FLAG=""
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE_FLAG="--prerelease" ;; esac
          # shellcheck disable=SC2086 # le drapeau vide ne doit pas devenir un argument
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft ${PRERELEASE_FLAG} \
            --title "DevEye ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            deveye-server-*.tar.gz SHA256SUMS

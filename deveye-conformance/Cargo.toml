[package]
name = "deveye-conformance"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Suite de conformité boîte noire du wire protocol DevEye : valide toute implémentation de SDK via son URL."
publish = false  # interne, non publié

[lints]
workspace = true

[lib]
name = "deveye_conformance"
path = "src/lib.rs"

[[bin]]
name = "deveye-conformance"
path = "src/main.rs"

[dependencies]
# Types du contrat `deveye.ui/1` (AGPL -> MIT : sens permis, ADR-0002).
deveye-core = { path = "../deveye-core", version = "1.2.0" }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[dev-dependencies]
# SDK Rust démarré en processus pour exiger 100 % de conformité (AGPL -> MIT : sens permis).
deveye-sdk = { path = "../deveye-sdk", version = "1.2.0" }
tracing = "0.1"

# cargo-deny — audit des dépendances (audit du 04/07/2026, item I3).
# Lancer : `cargo deny check` (advisories, bans, licenses, sources), comme le
# job CI `deny`. Décisions : ADR-0002 (licences), ADR-0006 et ADR-0007
# (exceptions d'avis).

[advisories]
version = 2
# RUSTSEC : vulnérabilités et crates non maintenues. `unmaintained` cadre au
# workspace : xcap et consorts tirent des crates d'écosystème X11/Wayland au
# rythme de maintenance inégal, on ne veut pas échouer sur du transitif profond.
unmaintained = "workspace"
ignore = [
    # quick-xml 0.30.0 : deux DoS (run-time quadratique / allocation namespace
    # non bornée). Tire UNIQUEMENT en build-dependency par xcb (lui-même via
    # xcap) pour parser les définitions de protocole X11 À LA COMPILATION —
    # jamais exposé à une entrée runtime non fiable. Pas de version corrigee
    # atteignable sans bump de xcb/xcap. À lever quand xcap remonte quick-xml.
    # ADR-0007.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # chrono 0.4 : déclaré non maintenu (RUSTSEC-2026-0543), sans version
    # corrigée. Aucune faille connue : seul le statut de maintenance est en
    # cause. chrono fait partie de l'API publique de deveye-core
    # (horodatages des snapshots et des événements de log) : le remplacer est
    # un changement cassant, réservé à la 2.0. Exception posée le 27/11/2026,
    # à rouvrir avant la 2.0. ADR-0006.
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
# Licences tierces acceptées (liste blanche exacte, complétée à l'usage : toute
# nouvelle licence dans le graphe doit être examinée, pas ajoutée par réflexe).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
# Nos propres crates : AGPL-3.0-or-later (outil) et MIT (bibliothèques) sont
# déclarés par chaque manifeste. L'exception AGPL est limitée à ces crates par
# nom : aucune dépendance tierce AGPL n'est acceptée implicitement. ADR-0002.
exceptions = [
    { crate = "deveye-server", allow = ["AGPL-3.0-or-later"] },
    { crate = "deveye-conformance", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-cdp-webview", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-clipboard-wayland", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-commands-http", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-composite", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-dioxus-signals", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-interaction-kwin-eis", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-logs-tracing", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-mcp-server", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-screencap-kwin", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-screencap-xcap", allow = ["AGPL-3.0-or-later"] },
    { crate = "adapter-x11", allow = ["AGPL-3.0-or-later"] },
]

[bans]
# Les doublons de versions gonflent les temps de build sans casser : warn.
multiple-versions = "warn"
wildcards = "deny"
# Les dépendances path internes du workspace n'ont pas de version : ce sont
# des "wildcards" légitimes, pas des dépendances flottantes de crates.io.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[package]
name = "adapter-x11"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Adapter DevEye : cible X11 isolée (yeux GetImage, mains XTEST, fenêtres QueryTree) pour tout serveur X privé (Xvfb) — aucune dépendance à xcap ni à un gestionnaire de fenêtres."
publish = false  # interne, non publié

[lints]
workspace = true

[dependencies]
deveye-core = { path = "../../deveye-core", version = "1.2.0" }
deveye-ports = { path = "../../deveye-ports", version = "1.2.0" }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
# Client X11 en Rust pur (aucune FFI, aucun unsafe) : connexion, QueryTree,
# GetImage, GetKeyboardMapping et l'extension XTEST (injection d'evenements).
x11rb = { version = "0.13", features = ["xtest"] }
# Encodage PNG des captures (version alignee sur le reste du workspace).
image = { version = "0.25", default-features = false, features = ["png"] }
# Table keysym <-> Unicode (formes historiques comme EuroSign) ; deja dans le
# Cargo.lock via xkbcommon, Rust pur.
xkeysym = "0.2"
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Client X11 de test : fenetre sonde qui compte les evenements recus.
x11rb = { version = "0.13", features = ["xtest"] }
image = { version = "0.25", default-features = false, features = ["png"] }

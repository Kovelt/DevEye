[package]
name = "adapter-composite"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Adapter DevEye : types composites génériques (ConsoleErrorSource, WaitCondition, AppInspector)."
publish = false  # interne, non publié

[lints]
workspace = true

[dependencies]
# `unstable-elements` : surface expérimentale des éléments par référence (ADR-0069, ADR-0072).
deveye-core = { path = "../../deveye-core", version = "1.1.0", features = ["unstable-elements"] }
deveye-ports = { path = "../../deveye-ports", version = "1.1.0", features = ["unstable-elements"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros"] }
# Decode/crop PNG pour le predicat ScreenshotRegionStable (hash d'une region).
# Version alignee sur le reste du workspace (screencap-*, adapter-mcp-server).
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"

[package]
name = "adapter-logs-tracing"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Adapter DevEye : LogSource consommant le buffer tracing du SDK opt-in (HTTP local)."
publish = false  # interne, non publie

[lints]
workspace = true

[dependencies]
deveye-core = { path = "../../deveye-core" }
deveye-ports = { path = "../../deveye-ports" }
deveye-sdk-client = { path = "../../deveye-sdk-client" }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt"] }

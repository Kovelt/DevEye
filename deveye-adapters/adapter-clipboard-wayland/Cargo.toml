[package]
name = "adapter-clipboard-wayland"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
authors = ["NuvoraCode <contact@nuvoracode.fr>"]
description = "Adapter DevEye : presse-papiers Wayland via wl-copy / wl-paste (wl-clipboard)."
publish = false  # crate interne proprietaire, jamais publiee sur crates.io

# Metadonnees figees localement — cf. deveye-core/Cargo.toml.

[dependencies]
deveye-ports = { path = "../../deveye-ports" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "rt", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# `sync` : Mutex asynchrone serialisant les tests fork+exec (evite ETXTBSY,
# cf. mod tests) — tenu a travers un await, contrairement au Mutex std.
tokio = { workspace = true, features = ["sync"] }

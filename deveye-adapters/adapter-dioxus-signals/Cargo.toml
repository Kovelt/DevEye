[package]
name = "adapter-dioxus-signals"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Adapter DevEye : AppInspector::state_snapshot via le SDK opt-in (HTTP local)."
publish = false  # interne, non publié

[lints]
workspace = true

[dependencies]
deveye-core = { path = "../../deveye-core" }

[package]
name = "adapter-dioxus-signals"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Adapter DevEye : AppInspector::state_snapshot via le SDK opt-in (HTTP local)."
publish = false  # interne, non publié

[lints]
workspace = true

[dependencies]
# `unstable-elements` : surface expérimentale des éléments par référence (ADR-0069, ADR-0074).
deveye-core = { path = "../../deveye-core", version = "1.2.0", features = ["unstable-elements"] }
deveye-ports = { path = "../../deveye-ports", version = "1.2.0", features = ["unstable-elements"] }
deveye-sdk-client = { path = "../../deveye-sdk-client", version = "1.2.0" }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt"] }

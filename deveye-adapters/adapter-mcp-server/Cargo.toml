[package]
name = "adapter-mcp-server"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Adapter DevEye : expose les ports en serveur MCP (stdio) pour Claude."
publish = false  # interne, non publié

[lints]
workspace = true

[dependencies]
# `schema` : dérive JsonSchema sur les types de domaine renvoyés tels quels par
# les outils MCP (WaitOutcome, WindowRect), source de leur outputSchema (ADR-0067).
# `unstable-elements` : port et types des éléments par référence, outils `snapshot` et `act`
# expérimentaux, hors promesse semver (ADR-0069, ADR-0072).
deveye-core = { path = "../../deveye-core", version = "1.1.0", features = ["schema", "unstable-elements"] }
deveye-ports = { path = "../../deveye-ports", version = "1.1.0", features = ["unstable-elements"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "time", "fs"] }
base64 = "0.22"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tracing = "0.1"
# Decode/crop/encode PNG pour screenshot_region (recadrage) et assert_visual
# (diff pixel), redimensionnement des captures ; la feature `jpeg` ajoute
# l'encodeur JPEG des captures et tire zune-core/zune-jpeg (ADR-0029).
# Version alignée sur le reste du workspace (screencap-*).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

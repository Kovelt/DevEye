[package]
name = "adapter-mcp-server"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
authors = ["NuvoraCode <contact@nuvoracode.fr>"]
description = "Adapter DevEye : expose les ports en serveur MCP (stdio) pour Claude."
publish = false  # crate interne proprietaire, jamais publiee sur crates.io

# Métadonnées figées localement — cf. deveye-core/Cargo.toml.

[dependencies]
deveye-core = { path = "../../deveye-core" }
deveye-ports = { path = "../../deveye-ports" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "time", "fs"] }
base64 = "0.22"
rmcp = { version = "1.7", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tracing = "0.1"
# Decode/crop/encode PNG pour screenshot_region (recadrage) et assert_visual
# (diff pixel). Version alignee sur le reste du workspace (screencap-*).
image = { version = "0.25", default-features = false, features = ["png"] }

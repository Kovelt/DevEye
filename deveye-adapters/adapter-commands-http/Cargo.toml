[package]
name = "adapter-commands-http"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "LicenseRef-Proprietary"
authors = ["NuvoraCode <contact@nuvoracode.fr>"]
description = "Adapter DevEye : CommandRouter via POST /devtools/command et GET /devtools/commands du SDK opt-in (HTTP local)."

# Métadonnées figées localement — cf. deveye-core/Cargo.toml.

[dependencies]
deveye-core = { path = "../../deveye-core" }
deveye-ports = { path = "../../deveye-ports" }
deveye-sdk-client = { path = "../../deveye-sdk-client" }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt"] }

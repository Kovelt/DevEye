[package]
name = "adapter-screencap-xcap"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Adapter DevEye fallback : capture d'une fenetre OS via la crate xcap (universel, sans webview)."
publish = false  # interne, non publie

[dependencies]
deveye-core = { path = "../../deveye-core" }
deveye-ports = { path = "../../deveye-ports" }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
xcap = "0.9.6"
image = { version = "0.25", default-features = false, features = ["png"] }

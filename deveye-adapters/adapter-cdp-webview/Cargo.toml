[package]
name = "adapter-cdp-webview"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Adapter DevEye pilotant un webview via Chrome DevTools Protocol (WebView2, Chromium, Edge)."
publish = false  # interne, non publié

[lints]
workspace = true

[dependencies]
deveye-core = { path = "../../deveye-core", version = "1.1.0" }
deveye-ports = { path = "../../deveye-ports", version = "1.1.0" }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "net", "time", "rt"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
base64 = "0.22"
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[package]
name = "adapter-screencap-kwin"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
authors = ["NuvoraCode <contact@nuvoracode.fr>"]
description = "Adapter DevEye : capture de fenetre Wayland via KWin D-Bus ScreenShot2 (pixel-perfect, sans XWayland)."
publish = false  # crate interne proprietaire, jamais publiee sur crates.io

# Métadonnées figées localement — cf. deveye-core/Cargo.toml.

[dependencies]
deveye-core = { path = "../../deveye-core" }
deveye-ports = { path = "../../deveye-ports" }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "fs"] }
zbus = { workspace = true }
nix = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
# L11: creation de fichier temporaire O_EXCL (nom aleatoire, evite TOCTOU sur /tmp).
tempfile = "3"
tracing = "0.1"

[dev-dependencies]
deveye-ports = { path = "../../deveye-ports" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

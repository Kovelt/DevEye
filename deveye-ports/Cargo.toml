[package]
name = "deveye-ports"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Ports DevEye : traits Renderer, AppInspector, InteractionSink, LogSource, CommandRouter et autres."
readme = "README.md"
keywords = ["devtools", "testing", "ui", "mcp", "ports"]
categories = ["development-tools", "development-tools::testing", "asynchronous"]
documentation = "https://docs.rs/deveye-ports"

[lints]
workspace = true

[dependencies]
deveye-core = { path = "../deveye-core", version = "1.1.0" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
# Surface expérimentale (ADR-0069, ADR-0072) : port `ElementInspector`, hors
# promesse semver. Active la feature homonyme de `deveye-core`.
unstable-elements = ["deveye-core/unstable-elements"]

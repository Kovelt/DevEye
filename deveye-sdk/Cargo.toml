[package]
name = "deveye-sdk"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SDK opt-in DevEye : micro-serveur HTTP local pour exposer le state d'une app en dev."
publish = false  # interne, non publie

# Destiné à être ajouté en dépendance de l'app cible UNIQUEMENT en
# cfg(debug_assertions).

[dependencies]
deveye-core = { path = "../deveye-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# rt-multi-thread : le SDK porte son propre runtime dédié (1 thread) pour
# être appelable hors de tout contexte tokio (avant `dioxus::launch`).
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "net", "macros", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# CORS deny-all explicite sur le serveur HTTP local (cf. init()).
tower-http = { version = "0.7", default-features = false, features = ["cors"] }
chrono = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
reqwest = { workspace = true }
tracing = "0.1"

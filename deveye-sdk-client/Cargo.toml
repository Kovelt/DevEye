[package]
name = "deveye-sdk-client"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Client HTTP partagé pour dialoguer avec le SDK opt-in de DevEye."
readme = "README.md"
keywords = ["devtools", "testing", "ui", "mcp", "http"]
categories = ["development-tools", "development-tools::testing", "web-programming::http-client"]
documentation = "https://docs.rs/deveye-sdk-client"

[lints]
workspace = true

[dependencies]
# Dépendances internes MIT -> MIT (invariant ADR-0002) : PortError pour les
# erreurs de protocole ; `tracing` pour l'avertissement de version.
deveye-ports = { path = "../deveye-ports", version = "0.2.0" }
reqwest = { workspace = true }
serde = { workspace = true }
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }
wiremock = "0.6"

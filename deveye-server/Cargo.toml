[package]
name = "deveye-server"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Binaire DevEye : compose les adapters et expose un serveur MCP à Claude."
publish = false  # interne, non publié
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "deveye-server"
path = "src/main.rs"

[dependencies]
# `unstable-elements` : éléments par référence (`snapshot`, `act`), expérimental (ADR-0069, ADR-0073).
deveye-core = { path = "../deveye-core", version = "1.1.0", features = ["unstable-elements"] }
deveye-ports = { path = "../deveye-ports", version = "1.1.0", features = ["unstable-elements"] }
deveye-sdk-client = { path = "../deveye-sdk-client", version = "1.1.0" }
adapter-cdp-webview = { path = "../deveye-adapters/adapter-cdp-webview", version = "1.1.0" }
adapter-screencap-xcap = { path = "../deveye-adapters/adapter-screencap-xcap", version = "1.1.0" }
adapter-dioxus-signals = { path = "../deveye-adapters/adapter-dioxus-signals", version = "1.1.0" }
adapter-logs-tracing = { path = "../deveye-adapters/adapter-logs-tracing", version = "1.1.0" }
adapter-commands-http = { path = "../deveye-adapters/adapter-commands-http", version = "1.1.0" }
adapter-screencap-kwin = { path = "../deveye-adapters/adapter-screencap-kwin", version = "1.1.0" }
adapter-interaction-kwin-eis = { path = "../deveye-adapters/adapter-interaction-kwin-eis", version = "1.1.0" }
adapter-mcp-server = { path = "../deveye-adapters/adapter-mcp-server", version = "1.1.0" }
adapter-composite = { path = "../deveye-adapters/adapter-composite", version = "1.1.0" }
adapter-clipboard-wayland = { path = "../deveye-adapters/adapter-clipboard-wayland", version = "1.1.0" }
adapter-x11 = { path = "../deveye-adapters/adapter-x11", version = "1.1.0" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "net", "process", "time"] }
reqwest = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
# Sortie des traces sur STDERR uniquement : stdout est le canal MCP (stdio).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
# Fenêtre fixture du test de bout en bout MCP (tests/e2e_mcp.rs) : client X11
# en Rust pur, déjà dans le graphe via adapter-x11.
x11rb = "0.13"

[package]
name = "deveye-server"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Binaire DevEye : compose les adapters et expose un serveur MCP a Claude."
publish = false  # interne, non publie

[lints]
workspace = true

[[bin]]
name = "deveye-server"
path = "src/main.rs"

[dependencies]
deveye-core = { path = "../deveye-core" }
deveye-ports = { path = "../deveye-ports" }
adapter-cdp-webview = { path = "../deveye-adapters/adapter-cdp-webview" }
adapter-screencap-xcap = { path = "../deveye-adapters/adapter-screencap-xcap" }
adapter-dioxus-signals = { path = "../deveye-adapters/adapter-dioxus-signals" }
adapter-logs-tracing = { path = "../deveye-adapters/adapter-logs-tracing" }
adapter-commands-http = { path = "../deveye-adapters/adapter-commands-http" }
adapter-screencap-kwin = { path = "../deveye-adapters/adapter-screencap-kwin" }
adapter-interaction-kwin-eis = { path = "../deveye-adapters/adapter-interaction-kwin-eis" }
adapter-mcp-server = { path = "../deveye-adapters/adapter-mcp-server" }
adapter-composite = { path = "../deveye-adapters/adapter-composite" }
adapter-clipboard-wayland = { path = "../deveye-adapters/adapter-clipboard-wayland" }
adapter-x11 = { path = "../deveye-adapters/adapter-x11" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
# Sortie des traces sur STDERR uniquement : stdout est le canal MCP (stdio).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[package]
name = "deveye-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "LicenseRef-Proprietary"
authors = ["NuvoraCode <contact@nuvoracode.fr>"]
description = "Domaine pur de DevEye : AppSession, Snapshot, InteractionCommand, Recording, Diff."

# Métadonnées figées localement (et non héritées du workspace Chronos) pour préparer
# la migration vers un repo dédié `git.nuvoracode.fr/deveye` via `git subtree split`.
# Voir docs/architecture/deveye.md, section « Garde-fous de migration ».

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

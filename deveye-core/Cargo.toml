[package]
name = "deveye-core"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Domaine pur de DevEye : commandes d'interaction, snapshots, prédicats d'attente, logs, erreurs console et fenêtres."
readme = "README.md"
keywords = ["devtools", "testing", "ui", "mcp", "debugging"]
categories = ["development-tools", "development-tools::testing", "data-structures"]
documentation = "https://docs.rs/deveye-core"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Optionnelle et désactivée par défaut : sert uniquement à générer le JSON Schema
# de deveye.ui/1 (ADR-0063). Une app qui embarque le SDK n'en tire rien.
schemars = { version = "1", optional = true }

[features]
default = []
# Dérive `schemars::JsonSchema` sur les types du module `ui`.
schema = ["dep:schemars"]

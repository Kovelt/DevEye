# CI DevEye — GitLab (git.kovelt.fr). Jobs : fmt, clippy, tests unitaires.
#
# NB : le repo est sur GitLab, pas GitHub — d'ou ce `.gitlab-ci.yml` (et non
# un workflow GitHub Actions). Necessite un runner Docker sur l'instance.
stages:
  - check

variables:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: rust:latest
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - target/
  before_script:
    # Dependances systeme des adapters Linux :
    #   xcap (screenshot)  -> libxcb, libxrandr, libgbm (backend Wayland
    #                          libwayshot depuis xcap 0.9)
    #   zbus (KWin D-Bus)  -> libdbus
    #   xkbcommon (EIS)    -> libxkbcommon ; reis est pur Rust (pas de libei)
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        libxcb1-dev libxrandr-dev libdbus-1-dev libxkbcommon-dev libgbm-dev
    - rustup component add rustfmt clippy

fmt:
  stage: check
  script:
    - cargo fmt --all --check

clippy:
  stage: check
  script:
    - cargo clippy --workspace --all-targets -- -D warnings

test:
  stage: check
  script:
    - cargo test --workspace

# Le binaire reellement distribue (.mcp.json pointe un build release) n'etait
# jamais construit ni teste en CI ; or debug et release divergent (overflow
# arithmetique : panique en debug, wrap silencieux en release). Audit I1.
release:
  stage: check
  script:
    - cargo build --release -p deveye-server
    - cargo test --workspace --release

# Verifie le plancher annonce par rust-version (1.81 sur les 15 crates) —
# rust:latest ne le garantit pas. Audit I4.
msrv:
  stage: check
  image: rust:1.88
  script:
    - cargo check --workspace --all-targets

# Vulnerabilites RustSec + doublons de versions (deny.toml). Audit I3.
audit-deps:
  stage: check
  script:
    - command -v cargo-deny >/dev/null || cargo install cargo-deny --locked
    - cargo deny check advisories bans sources

# Tests d'integration de la cible X11 (#[ignore] : ils demarrent leur propre
# Xvfb prive, display libre entre :251 et :259). Optionnel : n'echoue pas le
# pipeline tant que l'image du runner n'a pas Xvfb de facon fiable.
x11-integration:
  stage: check
  allow_failure: true
  script:
    - apt-get install -y --no-install-recommends xvfb
    - cargo test -p adapter-x11 -- --ignored --test-threads=1
